name: release

# Runs when the maintainer pushes a version tag (v1.2.3) on a commit of main:
# builds the Windows x64 installer + portable exe and the macOS arm64 dmg + zip, then creates a GitHub release.
# The tag must match the VERSION file (set it with `node scripts/version.js 1.2.3`, commit, tag, push the tag).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag is on main and matches VERSION
        id: v
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Tag $GITHUB_REF_NAME is not on main"; exit 1; }
          node scripts/version.js --check "$GITHUB_REF_NAME"
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis portable --x64
          - os: macos-15 # Apple silicon runner
            target: --mac dmg zip --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/version.js
      - run: node scripts/build-renderer.js
      - name: Package
        shell: bash
        # No signing certificate: Windows builds are unsigned, macOS builds are ad-hoc signed.
        run: npx electron-builder ${{ matrix.target }} --publish never -c.mac.identity=-
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Start the packaged app (terminal + MCP)
        run: node test-e2e/packaged.js
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          cat > notes.md <<EOF
          Agent Terminal Manager ${{ needs.check.outputs.version }}

          - Windows x64: \`Agent Terminal Manager Setup ${{ needs.check.outputs.version }}.exe\` (installer) or \`Agent Terminal Manager ${{ needs.check.outputs.version }}.exe\` (portable). Unsigned: SmartScreen asks once (More info → Run anyway).
          - macOS Apple silicon: \`.dmg\` or \`.zip\` (arm64). Not notarized: after copying to Applications run \`xattr -dr com.apple.quarantine "/Applications/Agent Terminal Manager.app"\` once.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Agent Terminal Manager ${{ needs.check.outputs.version }}" --notes-file notes.md --generate-notes
