name: build

# Manual only (Actions tab → build → Run workflow) until the app is stable; see AGENT.md.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # macOS: provide an SSH target (user-level sshd on 127.0.0.1 with key auth), tmux and OpenCode
      # so the SSH, tmux, port-forwarding, agent-session and orchestrator steps run there too.
      - name: SSH target, tmux and OpenCode (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install tmux
          npm i -g @opencode/cli && opencode --version
          mkdir -p ~/.ssh ~/sshd && chmod 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
          ssh-keygen -q -t ed25519 -N '' -f ~/sshd/hostkey
          cat > ~/sshd/sshd_config <<EOF
          Port 2222
          ListenAddress 127.0.0.1
          HostKey $HOME/sshd/hostkey
          PidFile $HOME/sshd/sshd.pid
          AuthorizedKeysFile $HOME/.ssh/authorized_keys
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          UsePAM no
          StrictModes no
          SetEnv PATH=$(dirname "$(command -v node)"):/usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
          EOF
          /usr/sbin/sshd -f ~/sshd/sshd_config -E ~/sshd/log
          sleep 1
          ssh-keyscan -p 2222 127.0.0.1 >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -p 2222 "$USER@127.0.0.1" 'echo ssh-ok; command -v tmux || echo "PATH=$PATH"'
          echo "TERMCLAW_E2E_SSH=$USER@127.0.0.1:2222" >> "$GITHUB_ENV"
          echo "TERMCLAW_E2E_OPENCODE=1" >> "$GITHUB_ENV"
      - name: E2E (local shell, UI, MCP; macOS also SSH/tmux/OpenCode)
        run: npm run e2e
        env:
          TERMCLAW_E2E_SHOTS: e2e-shots
      - name: Package
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Start the packaged app on the fresh runner (terminal + MCP)
        run: node test-e2e/packaged.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            e2e-shots/
