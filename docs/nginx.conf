# Agent Terminal Manager – MCP über HTTPS veröffentlichen (Nginx-Reverse-Proxy, kein Tunnel)
#
# Voraussetzungen:
#  - Die App läuft auf diesem Rechner, MCP-Server gebunden an 127.0.0.1:47900 (Standard).
#    Läuft Nginx auf einem anderen Rechner im LAN, in der App als Bind-Adresse die LAN-IP setzen
#    und den Port per Firewall nur für den Nginx-Rechner freigeben.
#  - Ein Zertifikat, z. B. per certbot (Let's Encrypt).
#  - In der App einen Token erzeugen (MCP → Token). Ohne gültigen Bearer-Token antwortet der Server mit 401.
#
# Claude (App/Web/Sprachmodus) als Custom Connector:  https://atm.example.com/mcp
#   Header: Authorization: Bearer atm_...

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name atm.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name atm.example.com;

    ssl_certificate     /etc/letsencrypt/live/atm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atm.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Nur den MCP-Endpunkt veröffentlichen.
    location = /mcp {
        # Optional zusätzlich auf bekannte Netze beschränken:
        # allow 160.79.104.0/23;   # Anthropic-Adressbereich (prüfen!)
        # deny all;

        limit_except GET POST DELETE { deny all; }

        proxy_pass http://127.0.0.1:47900/mcp;
        proxy_http_version 1.1;

        # Streamable HTTP nutzt Server-Sent Events: nicht puffern, lange Timeouts (wait_until_idle blockiert).
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;
        chunked_transfer_encoding on;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # die App protokolliert diese Adresse
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Mcp-Session-Id $http_mcp_session_id;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;

        client_max_body_size 4m;
    }

    location / { return 404; }

    access_log /var/log/nginx/atm-mcp.access.log;
}
