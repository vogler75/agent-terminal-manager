# Agent Terminal Manager – publish MCP over HTTPS (Nginx reverse proxy, no tunnel)
#
# Requirements:
#  - The app runs on this machine, MCP server bound to 127.0.0.1:47900 (default).
#    If Nginx runs on another machine in the LAN, set the LAN IP as bind address in the app
#    and open the port in the firewall for the Nginx machine only.
#  - A certificate, e.g. via certbot (Let's Encrypt).
#  - Create a token in the app (MCP → Token). Without a valid bearer token the server answers 401.
#
# Claude (app/web/voice mode) as a custom connector:  https://atm.example.com/mcp
#   Header: Authorization: Bearer atm_...

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name atm.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name atm.example.com;

    ssl_certificate     /etc/letsencrypt/live/atm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atm.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Publish only the MCP endpoint.
    location = /mcp {
        # Optionally restrict to known networks as well:
        # allow 160.79.104.0/23;   # Anthropic address range (verify!)
        # deny all;

        limit_except GET POST DELETE { deny all; }

        proxy_pass http://127.0.0.1:47900/mcp;
        proxy_http_version 1.1;

        # Streamable HTTP uses server-sent events: no buffering, long timeouts (wait_until_idle blocks).
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;
        chunked_transfer_encoding on;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # the app logs this address
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Mcp-Session-Id $http_mcp_session_id;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;

        client_max_body_size 4m;
    }

    location / { return 404; }

    access_log /var/log/nginx/atm-mcp.access.log;
}
